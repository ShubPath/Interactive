<style>
:root{--bg:#e9f1ee;--sf:#fff;--ink:#10231f;--mut:#38524c;--ln:#d5e3de;--ac:#0e7c6b;--rg:#d81b60;--tl:#2457a6;--gd:#e8a317;--bad:#c2410c;--h1:#06382f;--h2:#0b2f63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07201c;--sf:#0e2f2a;--ink:#eaf6f2;--mut:#f2fbf8;--ln:#1d4a42;--ac:#2fd1b3;--rg:#ff5c93;--tl:#6aa0ff;--gd:#ffc94a;--bad:#fb923c;--h1:#0a5a4b;--h2:#12408a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07201c;--sf:#0e2f2a;--ink:#eaf6f2;--mut:#f2fbf8;--ln:#1d4a42;--ac:#2fd1b3;--rg:#ff5c93;--tl:#6aa0ff;--gd:#ffc94a;--bad:#fb923c;--h1:#0a5a4b;--h2:#12408a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Manrope',system-ui,sans-serif}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0}
.w{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:center;text-align:center;position:relative;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:30px 28px;border-radius:22px;color:#fff;background:radial-gradient(circle at 100% 0,rgba(255,190,60,.42),transparent 30%),linear-gradient(120deg,var(--h1),var(--h2));box-shadow:0 14px 34px -14px rgba(6,56,47,.6)}
h1{font-size:34px;letter-spacing:.2px}h1::before{content:'';display:inline-block;width:16px;height:16px;margin-right:12px;background:linear-gradient(135deg,#fff3c4,#e8a317);transform:rotate(45deg);border-radius:3px;box-shadow:0 0 14px #ffc94a}header p{margin:4px 0 0;color:rgba(255,255,255,.8)}
header .hb{display:flex;gap:8px;position:absolute;right:22px;top:50%;transform:translateY(-50%)}header button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.bar{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
select,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px}
input[type=number]{width:78px}button{cursor:pointer}button:hover{border-color:var(--gd)}
.chk{flex-direction:row;align-items:center;gap:6px;align-self:center;font-size:13px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kc{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(145deg,#0e9f86,#06604f);box-shadow:0 10px 22px -12px rgba(6,56,47,.55)}
.kc:nth-child(4n+2){background:linear-gradient(145deg,#ee2a6c,#9c1245)}.kc:nth-child(4n+3){background:linear-gradient(145deg,#3a7be6,#1b4390)}.kc:nth-child(4n){background:linear-gradient(145deg,#f7b733,#d9840b);color:#2a1a00}
.kc b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-top:2px}.kc span{opacity:.85;font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border-radius:999px;padding:7px 16px}nav button.on{background:linear-gradient(135deg,#f7b733,#e8a317);color:#2a1a00;border-color:transparent;font-weight:700}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:20px;box-shadow:0 8px 24px -16px rgba(6,56,47,.45);padding:16px;min-width:0;grid-column:span 6}
.c.f{grid-column:span 12}.c.t{grid-column:span 4}
.c h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:9px}.c h2::before{content:'';width:9px;height:9px;transform:rotate(45deg);background:var(--gd);border-radius:2px;flex:none}.ch{position:relative;height:280px}
.note{color:var(--mut);font-size:12px;margin:8px 0 0}
.sc{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--sf);text-align:left;color:var(--mut);font-weight:500;cursor:pointer;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln)}td.n,th.n{text-align:right}tr.fl td{background:color-mix(in srgb,var(--bad) 10%,transparent)}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 8px #ffc94a}50%{box-shadow:0 0 22px 4px #ffc94a}}
@keyframes sheen{0%{background-position:-120% 0}100%{background-position:220% 0}}
.g.in .c{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
.go .kc{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.go .kc:nth-child(2){animation-delay:.07s}.go .kc:nth-child(3){animation-delay:.14s}.go .kc:nth-child(4){animation-delay:.21s}.go .kc:nth-child(5){animation-delay:.28s}.go .kc:nth-child(6){animation-delay:.35s}.go .kc:nth-child(7){animation-delay:.42s}.go .kc:nth-child(8){animation-delay:.49s}
h1::before{animation:glow 2.6s ease-in-out infinite}
.kc{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}.kc:hover{transform:translateY(-4px);box-shadow:0 16px 28px -12px rgba(6,56,47,.65)}
.kc::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:60% 100%;background-repeat:no-repeat;background-position:-120% 0;pointer-events:none}.kc:hover::after{animation:sheen 1s}
.c{transition:transform .25s,box-shadow .25s}.c:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(6,56,47,.6)}
nav button,button{transition:transform .15s,background .2s,border-color .2s}nav button:hover{transform:translateY(-2px)}button:active{transform:scale(.95)}
tr{transition:background .15s}tbody tr:hover td,table tr:hover td{background:color-mix(in srgb,var(--gd) 14%,transparent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
header{overflow:hidden}
h1::before{display:none}
h1{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:inherit;line-height:1.05;animation:flo 5s ease-in-out infinite}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:60px;letter-spacing:1px;white-space:nowrap;background:linear-gradient(100deg,#fff 0%,#ffe08a 22%,#fff 42%,#ffc94a 62%,#fff 82%,#ffe08a 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 16px rgba(255,201,74,.5))}
.big .l{display:inline-block;transition:transform .2s;animation:pop .8s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:calc(var(--n)*70ms)}
.big .l:hover{transform:translateY(-8px) rotate(-5deg) scale(1.12)}
.small{display:flex;align-items:center;gap:14px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:22px;color:#ffe9a8;animation:fade 1.2s .9s backwards}
.small::before,.small::after{content:'';width:80px;height:2px;background:linear-gradient(90deg,transparent,#ffc94a);transform-origin:right;animation:grow 1s 1s backwards}
.small::after{background:linear-gradient(270deg,transparent,#ffc94a);transform-origin:left}
.small i{font-style:normal;font-size:11px;color:#ffc94a;animation:glow 2.6s ease-in-out infinite;border-radius:50%}
.sp{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);color:#ffe08a;opacity:0;pointer-events:none;font-style:normal;animation:tw 3.2s ease-in-out infinite;animation-delay:var(--d)}
